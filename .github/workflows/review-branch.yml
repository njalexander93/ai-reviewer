# Exercise the candidate implementation on its own PR before it reaches main.
name: Branch review test
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # Only the explicitly selected, same-repository implementation branch may use secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/automated-pr-review'
    # Local reusable workflows come from this caller's commit, including the PR merge ref.
    uses: ./.github/workflows/review.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      implementation-ref: ${{ github.sha }}
      implementation-repository: ${{ github.repository }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEWER_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN }}
